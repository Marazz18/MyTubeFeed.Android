name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyTubeFeed-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyTubeFeed-Android
          path: MyTubeFeed-Android.apk

      # Release s APK je vždy "pre-release", aby ho rozšíření (releases/latest) nepovažovalo za novou verzi rozšíření.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: MyTubeFeed-Android.apk
          prerelease: true
          make_latest: false
